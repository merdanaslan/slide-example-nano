<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Minimal — Superteam Germany</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200&display=swap" rel="stylesheet">
</head>
<body>
    <div class="desktop">
        <div class="canvas">

            <nav class="min-nav">
                <img src="../logos/superteam-black.png" height="14" alt="Superteam" style="opacity:0.4;">
                <span class="min-nav-label" id="nav-label">—</span>
            </nav>

            <div class="slides-wrapper" id="slides-wrapper">

                <!-- 1. Title -->
                <div class="slide">
                    <div class="layout-center fade-in text-center">
                        <h1 class="min-hero">The future<br>of European<br>Web3.</h1>
                        <p class="min-sub mt-xl text-ultra-muted">Superteam Germany · 2026</p>
                    </div>
                </div>

                <!-- 2. One stat -->
                <div class="slide">
                    <div class="layout-center fade-in text-center">
                        <p class="min-label mb-l">THE GAP</p>
                        <h2 class="min-stat">15<span class="min-stat-unit">M</span></h2>
                        <p class="min-caption mt-xl text-ultra-muted max-w-400 mx-auto">European systems engineers with no Web3 onramp.</p>
                    </div>
                </div>

                <!-- 3. Three words -->
                <div class="slide">
                    <div class="layout-center fade-in text-center">
                        <p class="min-label mb-xl">THE MODEL</p>
                        <div class="word-stack">
                            <div class="word-row"><span class="word-num">01</span><h2 class="word-item">Empower.</h2></div>
                            <div class="word-row"><span class="word-num">02</span><h2 class="word-item">Connect.</h2></div>
                            <div class="word-row"><span class="word-num">03</span><h2 class="word-item">Accelerate.</h2></div>
                        </div>
                    </div>
                </div>

                <!-- 4. Quiet numbers -->
                <div class="slide">
                    <div class="layout-center fade-in text-center">
                        <p class="min-label mb-xl">TRACTION</p>
                        <div class="min-metrics">
                            <div class="min-metric">
                                <h3 class="min-metric-num">150+</h3>
                                <span class="min-metric-key">Members</span>
                            </div>
                            <div class="min-rule-v"></div>
                            <div class="min-metric">
                                <h3 class="min-metric-num">$4M+</h3>
                                <span class="min-metric-key">Granted</span>
                            </div>
                            <div class="min-rule-v"></div>
                            <div class="min-metric">
                                <h3 class="min-metric-num">31+</h3>
                                <span class="min-metric-key">Winners</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 5. Pure CTA -->
                <div class="slide">
                    <div class="layout-center fade-in text-center">
                        <h1 class="min-hero">Join us.</h1>
                        <p class="min-sub mt-xl text-ultra-muted">de.superteam.fun</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
